<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feliz Cumpleaños ❤️</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Georgia, "Times New Roman", serif;

}


/* =====================================================
   VIDEO DE FONDO
===================================================== */

#video-fondo {

    position: fixed;

    top: 50%;
    left: 50%;

    width: 100vw;
    height: 100vh;

    transform: translate(-50%, -50%);

    object-fit: cover;

    z-index: -10;

    pointer-events: none;
}


/* =====================================================
   OSCURECER LIGERAMENTE EL VIDEO
   Si no quieres ningún oscurecimiento, elimina esto.
===================================================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background: rgba(255, 220, 230, 0.18);

    z-index: -5;

    pointer-events: none;
}


/* =====================================================
   TÍTULO
===================================================== */

.titulo {

    position: fixed;

    top: 40px;
    left: 0;

    width: 100%;

    text-align: center;

    color: #a51f4d;

    font-size: clamp(35px, 6vw, 65px);

    font-weight: normal;

    letter-spacing: 2px;

    text-shadow:
        0 3px 12px rgba(130, 25, 60, .25);

    z-index: 20;
}


/* =====================================================
   CARTA
===================================================== */

.contenedor-carta {

    position: relative;

    width: 380px;
    height: 260px;

    margin-top: 50px;

    cursor: pointer;

    perspective: 1200px;

    z-index: 10;
}


/* =====================================================
   SOBRE
===================================================== */

.sobre {

    position: absolute;

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            145deg,
            #f7a7bb,
            #e97697
        );

    border-radius: 8px;

    box-shadow:
        0 25px 55px rgba(90,20,40,.25);

    z-index: 3;
}


/* =====================================================
   PARTE FRONTAL
===================================================== */

.sobre-frontal {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 0;
    height: 0;

    border-left: 190px solid transparent;
    border-right: 190px solid transparent;
    border-bottom: 145px solid #d96082;

    z-index: 5;
}


/* =====================================================
   SOLAPA
===================================================== */

.solapa {

    position: absolute;

    top: 0;
    left: 0;

    width: 0;
    height: 0;

    border-left: 190px solid transparent;
    border-right: 190px solid transparent;
    border-top: 145px solid #ef8ca7;

    transform-origin: top center;

    transition:
        transform 1.2s cubic-bezier(.4,0,.2,1);

    z-index: 8;
}


/* =====================================================
   HOJA
===================================================== */

.hoja {

    position: absolute;

    width: 330px;
    height: 210px;

    left: 25px;
    bottom: 20px;

    background:
        linear-gradient(
            135deg,
            #fffefc,
            #fff8f3
        );

    border-radius: 4px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.12);

    z-index: 2;

    transition:
        bottom 1.3s ease,
        transform 1.3s ease;
}


/* =====================================================
   SELLO
===================================================== */

.sello {

    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 58px;
    height: 58px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle,
            #c42c5c,
            #95183f
        );

    color: white;

    font-size: 27px;

    box-shadow:
        0 6px 15px rgba(90,15,40,.25);

    z-index: 9;

    transition:
        opacity .4s ease;
}


/* =====================================================
   CARTA ABIERTA
===================================================== */

.contenedor-carta.abierta .solapa {

    transform:
        rotateX(180deg);

}

.contenedor-carta.abierta .hoja {

    bottom: 115px;

    transform:
        translateY(-50px);

}

.contenedor-carta.abierta .sello {

    opacity: 0;

}


/* =====================================================
   INDICACIÓN
===================================================== */

.indicacion {

    position: fixed;

    bottom: 45px;

    color: #ff0606;

    font-size: 20px;

    letter-spacing: 5px;

    animation:
        respirar 2s infinite;

    z-index: 20;
}


@keyframes respirar {

    0%,100% {
        opacity: 1;
    }

    50% {
        opacity: .4;
    }

}


/* =====================================================
   CORAZONES
===================================================== */

.corazon {

    position: fixed;

    bottom: -50px;

    font-size: 25px;

    pointer-events: none;

    z-index: 4;

    animation:
        subirCorazon linear infinite;

    opacity: 0;
}


@keyframes subirCorazon {

    0% {

        transform:
            translateY(0)
            rotate(0deg)
            scale(.7);

        opacity: 0;

    }

    10% {

        opacity: .9;

    }

    50% {

        transform:
            translateY(-50vh)
            rotate(20deg)
            scale(1);

        opacity: .8;

    }

    90% {

        opacity: .4;

    }

    100% {

        transform:
            translateY(-115vh)
            rotate(-20deg)
            scale(.8);

        opacity: 0;

    }

}


/* =====================================================
   POSICIÓN DE LOS CORAZONES
===================================================== */

.corazon:nth-of-type(1) {
    left: 5%;
    animation-duration: 8s;
    animation-delay: 1s;
}

.corazon:nth-of-type(2) {
    left: 15%;
    animation-duration: 11s;
    animation-delay: 4s;
}

.corazon:nth-of-type(3) {
    left: 27%;
    animation-duration: 9s;
    animation-delay: 2s;
}

.corazon:nth-of-type(4) {
    left: 42%;
    animation-duration: 12s;
    animation-delay: 6s;
}

.corazon:nth-of-type(5) {
    left: 58%;
    animation-duration: 9s;
    animation-delay: 3s;
}

.corazon:nth-of-type(6) {
    left: 70%;
    animation-duration: 11s;
    animation-delay: 1s;
}

.corazon:nth-of-type(7) {
    left: 82%;
    animation-duration: 8s;
    animation-delay: 5s;
}

.corazon:nth-of-type(8) {
    left: 94%;
    animation-duration: 13s;
    animation-delay: 2s;
}


/* =====================================================
   PÉTALOS
===================================================== */

.petalo {

    position: fixed;

    top: -40px;

    width: 15px;
    height: 22px;

    background:
        linear-gradient(
            135deg,
            #f27b9c,
            #c92e5b
        );

    border-radius:
        100% 0 100% 0;

    opacity: .7;

    pointer-events: none;

    animation:
        caer linear infinite;

    z-index: 3;
}


@keyframes caer {

    0% {

        transform:
            translateY(-50px)
            translateX(0)
            rotate(0deg);

        opacity: 0;

    }

    10% {

        opacity: .8;

    }

    50% {

        transform:
            translateY(50vh)
            translateX(80px)
            rotate(180deg);

    }

    100% {

        transform:
            translateY(110vh)
            translateX(-100px)
            rotate(360deg);

        opacity: 0;

    }

}


/* =====================================================
   FLORES
===================================================== */

.flores {

    position: fixed;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 230px;

    pointer-events: none;

    z-index: 6;
}


/* =====================================================
   TALLOS
===================================================== */

.tallo {

    position: absolute;

    bottom: 0;

    width: 5px;

    border-radius: 10px;

    background:
        linear-gradient(
            to right,
            #315d36,
            #6d9860
        );

    transform-origin: bottom;
}


/* =====================================================
   ROSAS
===================================================== */

.rosa {

    position: absolute;

    width: 82px;
    height: 82px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 50% 50%,
            #741332 0%,
            #ad1f4c 18%,
            #d63d68 38%,
            #ee7697 62%,
            #bd2855 100%
        );

    box-shadow:
        inset 8px 7px 15px rgba(255,255,255,.25),
        0 8px 20px rgba(90,20,40,.22);

}


.rosa::before {

    content: "";

    position: absolute;

    width: 53px;
    height: 53px;

    top: 15px;
    left: 15px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #741330,
            #c12c5b 50%,
            #ec6c8e
        );

}


.rosa::after {

    content: "";

    position: absolute;

    width: 25px;
    height: 25px;

    top: 29px;
    left: 29px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #631128,
            #a51b47
        );

}


/* =====================================================
   TULIPANES
===================================================== */

.tulipan {

    position: absolute;

    width: 58px;
    height: 76px;

    border-radius:
        55% 55% 45% 45%;

    background:
        linear-gradient(
            135deg,
            #c81f50,
            #eb5c7f 50%,
            #b91847
        );

    box-shadow:
        inset 6px 5px 10px rgba(255,255,255,.25),
        0 8px 15px rgba(70,15,35,.18);

}


.tulipan::before {

    content: "";

    position: absolute;

    top: 0;
    left: 50%;

    width: 3px;
    height: 72px;

    background:
        rgba(110,15,45,.25);

    transform:
        translateX(-50%);

}


/* =====================================================
   FLORES IZQUIERDA
===================================================== */

.izquierda {

    position: absolute;

    left: 10px;
    bottom: 0;

    width: 270px;
    height: 230px;

}


.izquierda .rosa1 {

    left: 70px;
    bottom: 100px;

}


.izquierda .rosa2 {

    left: 140px;

}


.izquierda .tulipan1 {

}


.izquierda .tallo1 {

    left: 110px;

    transform:

}


.izquierda .tallo2 {

    left: 165px;

}


.izquierda .tallo3 {

    left: 55px;
    height: 135px;

    transform:
        rotate(-5deg);

}


/* =====================================================
   FLORES DERECHA
===================================================== */

.derecha {

    position: absolute;

    right: 10px;
    bottom: 0;

    width: 270px;
    height: 230px;

}


.derecha .rosa1 {

    right: 70px;
    bottom: 95px;

    transform:
        scale(.95);

}


.derecha .tulipan1 {

    right: 15px;

}


.derecha .tulipan2 {

.derecha .tallo1 {

    transform:

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 700px) {

    }


    .sobre-frontal {

        border-right-width: 150px;
        border-bottom-width: 115px;

    }


    .solapa {

        border-left-width: 150px;
        border-right-width: 150px;
        border-top-width: 115px;

    }


    .hoja {

        width: 260px;
        height: 165px;

        left: 20px;

    }


    .contenedor-carta.abierta .hoja {

        bottom: 90px;

    }


    .flores {

        transform:

        transform-origin:
            bottom center;

    }


    .izquierda {

        left: -70px;

    }


    .derecha {

        right: -70px;

    }

}


/* =====================================================
   REDUCIR ANIMACIONES
===================================================== */

@media(prefers-reduced-motion: reduce) {

    .corazon,
    .petalo,
    .indicacion {

        animation: none;

    }

}

</style>
